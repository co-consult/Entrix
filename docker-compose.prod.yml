version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: entrix_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-entrix_db}
      POSTGRES_USER: ${POSTGRES_USER:-entrix_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-MS2023Igo4mtns}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    # Remove external port exposure for production
    ports:
      - "5432:5432"
    networks:
      - entrix_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-entrix_user} -d ${POSTGRES_DB:-entrix_db}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp
      - /var/run/postgresql

  # Redis for caching and queues
  redis:
    image: redis:7-alpine
    container_name: entrix_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-MSIgo4mtns}
    volumes:
      - redis_data:/data
    # Remove external port exposure for production
    # ports:
    #   - "6379:6379"
    networks:
      - entrix_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp

  # Redis Insights for monitoring (optional - can be disabled in production)
  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: entrix_redis_insight
    restart: unless-stopped
    environment:
      - REDIS_URI=redis://:${REDIS_PASSWORD:-MSIgo4mtns}@redis:6379
    volumes:
      - redis_insight_data:/db
    # Remove external port exposure for production
    # ports:
    #   - "8001:8001"
    networks:
      - entrix_network
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp
    profiles:
      - monitoring

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: entrix_backend
    restart: unless-stopped
    env_file:
      - env.production
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-entrix_user}:${POSTGRES_PASSWORD:-MS2023Igo4mtns}@postgres:5432/${POSTGRES_DB:-entrix_db}?schema=public
      
      # Redis
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-MSIgo4mtns}
      REDIS_URL: redis://:${REDIS_PASSWORD:-MSIgo4mtns}@redis:6379
      
      # JWT
      JWT_SECRET: ${JWT_SECRET:-Entrix2024!JWT#SuperSecretKey#Production#Secure}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      
      # SMTP Configuration - HARDCODED
      SMTP_HOST: smtp.ionos.fr
      SMTP_PORT: 465
      SMTP_USER: entrix@lawej.com
      SMTP_PASSWORD: "Zazou2002;!"
      SMTP_SECURE: "true"
      
      # Email Configuration
      EMAIL_HOST: smtp.ionos.fr
      EMAIL_PORT: 465
      EMAIL_USER: entrix@lawej.com
      EMAIL_PASS: "Zazou2002;!"
      EMAIL_FROM: entrix@lawej.com
      EMAIL_SECURE: "true"
      EMAIL_DEFAULT_REPLY_TO: entrix@lawej.com
      
      # Frontend URL
      FRONTEND_URL: https://css.cloud.ms2tech.fr
      
      # App
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: /api/v1
      
      # CORS - Update for production domain
      CORS_ORIGIN: ${CORS_ORIGIN:-https://css.cloud.ms2tech.fr}
      
      # Rate Limiting
      THROTTLE_TTL: ${THROTTLE_TTL:-60}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      
      # Security
      HELMET_ENABLED: "true"
      COMPRESSION_ENABLED: "true"
      
      # File Upload
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10485760}
      
      # QR Code
      QR_CODE_SECRET: ${QR_CODE_SECRET:-Entrix2024!QRCode#Secret#Production}
      
      # BullMQ
      BULLMQ_REDIS_URL: redis://:${REDIS_PASSWORD:-MSIgo4mtns}@redis:6379
      
      # Organizer ID (if needed)
      ORGANIZER_ID: ${ORGANIZER_ID:-e219c1e4-2f2e-4719-b2f9-c6ce4d2d8d2e}
      
    volumes:
      # Application data
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
      - ./backend/temp:/app/temp
      - ./backend/cache:/app/cache
      
      # Prisma generated files (if needed for runtime)
      - ./backend/prisma:/app/prisma
      
    # Remove external port exposure - will be accessed via Nginx Proxy Manager
    ports:
      - "3000:3000"
    networks:
      - entrix_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: entrix_frontend
    restart: unless-stopped
    env_file:
      - env.production
    environment:
      # Next.js
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://css.cloud.ms2tech.fr/api/v1}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://css.cloud.ms2tech.fr}
      
      # Authentication
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://css.cloud.ms2tech.fr}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-Entrix2024!NextAuth#Secret#Production#Secure}
      
      # Database (for NextAuth)
      DATABASE_URL: postgresql://${POSTGRES_USER:-entrix_user}:${POSTGRES_PASSWORD:-MS2023Igo4mtns}@postgres:5432/${POSTGRES_DB:-entrix_db}?schema=public
      
      # Email - HARDCODED
      EMAIL_SERVER_HOST: smtp.ionos.fr
      EMAIL_SERVER_PORT: 465
      EMAIL_SERVER_USER: entrix@lawej.com
      EMAIL_SERVER_PASSWORD: "Zazou2002;!"
      EMAIL_FROM: entrix@lawej.com
      
      # Google OAuth (if using)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      
      # Other OAuth providers
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      
      # App specific
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Entrix}
      NEXT_PUBLIC_ORGANIZER_ID: ${ORGANIZER_ID:-prod-organizer-001}
      
    volumes:
      # Application data (if needed for runtime)
      - ./frontend/public:/app/public
      
    # Remove external port exposure - will be accessed via Nginx Proxy Manager
    ports:
      - "3001:3001"
    networks:
      - entrix_network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp

  # Backup Service (Optional)
  backup:
    image: postgres:15-alpine
    container_name: entrix_backup
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-entrix_db}
      POSTGRES_USER: ${POSTGRES_USER:-entrix_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-MS2023Igo4mtns}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ./backups:/backups
      - ./backup-scripts:/backup-scripts
    networks:
      - entrix_network
    depends_on:
      - postgres
    command: ["/backup-scripts/backup.sh"]
    profiles:
      - backup

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/postgres
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/redis
  redis_insight_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/redis-insight


networks:
  entrix_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
    driver_opts:
      com.docker.network.bridge.name: entrix_net 